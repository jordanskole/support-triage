services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ac1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ac1}
      POSTGRES_DB: ${POSTGRES_DB:-ac1}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps versioned data dirs under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ac1}:${POSTGRES_PASSWORD:-ac1}@postgres:5432/${POSTGRES_DB:-ac1}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ac1}:${POSTGRES_PASSWORD:-ac1}@postgres:5432/${POSTGRES_DB:-ac1}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
