services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ac1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ac1}
      POSTGRES_DB: ${POSTGRES_DB:-ac1}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps versioned data dirs under /var/lib/postgresql.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
